apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.tonyfeng.jinshisuda'

    defaultConfig {
        applicationId "com.tonyfeng.jinshisuda"
        minSdkVersion 24
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    signingConfigs {
        config {
            keyAlias 'quiz'
            keyPassword 'Tony@2026App'
            storeFile file('/Users/soul/www/python/quiz_app/release.keystore')
            storePassword 'Tony@2026App'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.config
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.pangle_beta.cn:mediation-sdk:7.7.1.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:+'
    implementation 'com.google.zxing:core:3.5.3'
}